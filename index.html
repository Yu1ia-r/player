<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проигрыватель</title>
  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/main.css">
  <script src="app/main.js" defer></script>
</head>

<body>
  <div class="container">
    <div class="wrapper-left">
      <div class="add-song drop-zone">
        <p>Перетащите сюда аудиофайл (.mp3)</p>
      </div>
      <button class="player__button change-theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4" fill="#currentColor" />
          <path d="M12 5V3" stroke="#222222" stroke-width="2" stroke-linecap="round" />
          <path d="M12 21V19" stroke="#222222" stroke-width="2" stroke-linecap="round" />
          <path d="M16.9498 7.04996L18.364 5.63574" stroke="#222222" stroke-width="2" stroke-linecap="round" />
          <path d="M5.63608 18.3644L7.05029 16.9502" stroke="#222222" stroke-width="2" stroke-linecap="round" />
          <path d="M19 12L21 12" stroke="#222222" stroke-width="2" stroke-linecap="round" />
          <path d="M3 12L5 12" stroke="#222222" stroke-width="2" stroke-linecap="round" />
          <path d="M16.9498 16.95L18.364 18.3643" stroke="#222222" stroke-width="2" stroke-linecap="round" />
          <path d="M5.63608 5.63559L7.05029 7.0498" stroke="#222222" stroke-width="2" stroke-linecap="round" />
        </svg>

        <svg class="moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M15 4C15.292 4 15.438 4 15.5781 4.04183C16.192 4.22522 16.4775 4.93111 16.1637 5.48976C16.0921 5.61719 15.8744 5.82779 15.4389 6.249C13.935 7.70352 13 9.74257 13 12C13 14.2574 13.935 16.2965 15.4389 17.751C15.8744 18.1722 16.0921 18.3828 16.1637 18.5102C16.4775 19.0689 16.192 19.7748 15.5781 19.9582C15.438 20 15.292 20 15 20C10.5817 20 7 16.4183 7 12C7 7.58172 10.5817 4 15 4Z"
            fill="#222222" />
        </svg>



      </button>
    </div>
    <div class="player">
      <audio class="audio" src="Vetusta Morla - 23 de Junio.mp3"></audio>
      <img class="player__img" src="prevew.png" alt="" width="300px">
      <div class="player__body">
        <div class="player-timer timer">
          <span class="timer-value current-time">0:00</span>
          <input type="range" class="progress-bar" min="0" max="" value="0" step="1">
          <span class="timer-value end-time">0:00</span>
        </div>
        <div class="wrapper-options">
          <div class="volume">

            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M4.15838 13.9306C3.44537 12.7423 3.44537 11.2577 4.15838 10.0694C4.37596 9.70674 4.73641 9.45272 5.1511 9.36978L6.84413 9.03117C6.94499 9.011 7.03591 8.95691 7.10176 8.87788L9.17085 6.39498C10.3534 4.97592 10.9447 4.26638 11.4723 4.45742C12 4.64846 12 5.57207 12 7.41928L12 16.5807C12 18.4279 12 19.3515 11.4723 19.5426C10.9447 19.7336 10.3534 19.0241 9.17085 17.605L7.10176 15.1221C7.03591 15.0431 6.94499 14.989 6.84413 14.9688L5.1511 14.6302C4.73641 14.5473 4.37596 14.2933 4.15838 13.9306Z"
                fill="#222222" />
              <path
                d="M14.5355 8.46447C15.4684 9.39732 15.9948 10.6611 16 11.9803C16.0052 13.2996 15.4888 14.5674 14.5633 15.5076"
                stroke="#222222" stroke-width="2" stroke-linecap="round" />
              <path
                d="M18.6569 6.34314C20.1494 7.83572 20.9916 9.85769 20.9999 11.9685C21.0083 14.0793 20.182 16.1078 18.7012 17.6121"
                stroke="#222222" stroke-width="2" stroke-linecap="round" />
            </svg>


            <input type="range" class="volume-bar" min="0" max="1" value="" step="0.1">
          </div>
          <button class="player__button button-play" type="button">
            <svg class="icon icon-play" viewBox="0 0 58 75" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M51.93,43.9c5.49-3.55,5.47-7.5,0-10.64L9,1.86C4.55-.94-.12.71,0,6.55L.18,68.23c.38,6.34,4,8.07,9.33,5.14L51.93,43.9Z" />
            </svg>
            <svg class="icon icon-pause" viewBox="68 0 55 75" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M105.84,0h13.1a4,4,0,0,1,3.94,3.94V70.88a4,4,0,0,1-3.94,3.94h-13.1a4,4,0,0,1-3.94-3.94V3.94A4,4,0,0,1,105.84,0ZM71.94,0H85A4,4,0,0,1,89,3.94V70.88A4,4,0,0,1,85,74.82H71.94A4,4,0,0,1,68,70.88V3.94A4,4,0,0,1,71.94,0Z" />
            </svg>
          </button>
          <div></div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
